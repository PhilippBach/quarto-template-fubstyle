name: Check Quarto Themes

on:
  push:
    paths:
      - '**/*.qmd'
      - '**/*.scss'
      - '**/*.lua'
      - '**/*.yml'
      - '**/*.sh'
  pull_request:
    paths:
      - '**/*.qmd'
      - '**/*.scss'
      - '**/*.lua'
      - '**/*.yml'
      - '**/*.sh'
  workflow_dispatch:


jobs:
  render-themes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        theme:
          - fubstyle-theme
        format:
          - revealjs
          - html

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jupyter
          pip install numpy

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install theme extension
        run: |
          # Tell Quarto about the local extension
          quarto add ${{ matrix.theme }} --no-prompt

      - name: Render demo with custom format
        run: |
          # NB: no --output: combined with --output-dir it makes Quarto
          # write the file outside the output dir. Default file names are used.
          # Renders template-<format>.qmd using the `<theme>-<format>` format.
          # Every output type gets its own subfolder of _output so that
          # renders can never overwrite each other.
          quarto render ${{ matrix.theme }}/template-${{ matrix.format }}.qmd \
            --to ${{ matrix.theme }}-${{ matrix.format }} \
            --output-dir _output/${{ matrix.format }}

      - name: Install TinyTeX
        if: matrix.format == 'html'
        run: quarto install tinytex --no-prompt

      - name: Render demo to PDF
        if: matrix.format == 'html'
        run: |
          # Also render the html template to PDF to check the pdf-export feature
          quarto render ${{ matrix.theme }}/template-html.qmd \
            --to ${{ matrix.theme }}-pdf \
            --output-dir _output/pdf

      - name: Render demo to Jupyter Notebook
        if: matrix.format == 'html'
        run: |
          # Checks that the html template degrades gracefully in a notebook
          # (the optional-exercise filter turns the callout into a blockquote).
          # --no-execute keeps the notebook free of outputs, as for students.
          quarto render ${{ matrix.theme }}/template-html.qmd \
            --to ${{ matrix.theme }}-ipynb \
            --no-execute \
            --output-dir _output/ipynb

      - name: Test solution-block (solutions shown / hidden)
        if: matrix.format == 'html'
        run: |
          # Renders html, pdf (via its LaTeX source) and ipynb with solution: true,
          # solution: false and no setting, and checks the solution text is
          # present / absent accordingly.
          bash .github/scripts/check_solution_block.sh ${{ matrix.theme }} \
            ${{ matrix.theme }}/template-html.qmd

      - name: Export slides to PDF with decktape
        if: matrix.format == 'revealjs'
        run: |
          # The in-slide export button uses the browser print dialog; this step
          # tests the second export route, decktape, on the rendered slides.
          # Renders with solutions (default) and without (solution: false),
          # exports both, and checks page count, slide text and that the
          # solution text is absent from the student copy.
          sudo apt-get install -y poppler-utils >/dev/null
          cd ${{ matrix.theme }}
          quarto render template-revealjs.qmd \
            --to ${{ matrix.theme }}-revealjs --no-execute \
            -M solution:false --output-dir _output/revealjs-student
          marker="zero conditional mean"
          for variant in revealjs revealjs-student; do
            (cd _output/$variant && python -m http.server 8000 >/dev/null 2>&1 & echo $! > /tmp/server.pid)
            sleep 2
            npx --yes decktape reveal --chrome-arg=--no-sandbox \
              http://localhost:8000/template-revealjs.html \
              _output/decktape-$variant.pdf
            kill "$(cat /tmp/server.pid)"
            pages=$(pdfinfo _output/decktape-$variant.pdf | awk '/^Pages:/ {print $2}')
            echo "$variant: $pages pages"
            [ "$pages" -gt 1 ] || { echo "::error::decktape PDF has $pages page(s)"; exit 1; }
            pdftotext _output/decktape-$variant.pdf - | grep -q "Optional: Advanced Exercise" \
              || { echo "::error::slide text missing in $variant PDF"; exit 1; }
          done
          pdftotext _output/decktape-revealjs.pdf - | grep -q "$marker" \
            || { echo "::error::solution missing in decktape PDF with solutions"; exit 1; }
          if pdftotext _output/decktape-revealjs-student.pdf - | grep -q "$marker"; then
            echo "::error::solution leaked into student decktape PDF"; exit 1
          fi
          echo "decktape export OK"

      - name: Upload rendered outputs
        uses: actions/upload-artifact@v6
        with:
          # Intermediate artifact per matrix leg (revealjs/ or html/ + pdf/ +
          # ipynb/); merged into a single artifact by the job below.
          name: render-${{ matrix.theme }}-${{ matrix.format }}
          path: ${{ matrix.theme }}/_output

  merge-outputs:
    needs: render-themes
    runs-on: ubuntu-latest
    steps:
      - name: Merge all rendered outputs into one artifact
        uses: actions/upload-artifact/merge@v6
        with:
          # Contains the revealjs/, html/, pdf/ and ipynb/ subfolders
          name: rendered-outputs
          pattern: render-*
          delete-merged: true
