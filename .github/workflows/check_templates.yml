name: Check Quarto Themes

on:
  push:
    paths:
      - '**/*.qmd'
      - '**/*.scss'
  pull_request:
    paths:
      - '**/*.qmd'
      - '**/*.scss'
  workflow_dispatch:


jobs:
  render-themes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        theme:
          - fubstyle-theme
        format:
          - revealjs
          - html

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jupyter
          pip install numpy

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install theme extension
        run: |
          # Tell Quarto about the local extension
          quarto add ${{ matrix.theme }} --no-prompt

      - name: Render demo with custom format
        run: |
          # Renders template-<format>.qmd using the `<theme>-<format>` format
          quarto render ${{ matrix.theme }}/template-${{ matrix.format }}.qmd \
            --to ${{ matrix.theme }}-${{ matrix.format }} \
            --output-dir _output \
            --output template-${{ matrix.format }}.html

      - name: Install TinyTeX
        if: matrix.format == 'html'
        run: quarto install tinytex --no-prompt

      - name: Render demo to PDF
        if: matrix.format == 'html'
        run: |
          # Also render the html template to PDF to check the pdf-export feature
          quarto render ${{ matrix.theme }}/template-html.qmd \
            --to pdf \
            --output-dir _output \
            --output template-html-pdf.pdf

      - name: Convert demo to Jupyter Notebook
        if: matrix.format == 'html'
        run: |
          # Checks that the html template degrades gracefully when converted to a notebook
          quarto convert ${{ matrix.theme }}/template-html.qmd \
            --output ${{ matrix.theme }}/_output/template-html.ipynb

      - name: Upload rendered slides
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.theme }}-${{ matrix.format }}
          path: ${{ matrix.theme }}/_output
